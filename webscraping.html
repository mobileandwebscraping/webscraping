<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Scraping Services | Fast & Reliable</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Hero Section -->
  <section class="bg-white shadow-md py-20 px-4 text-center">
    <h1 class="text-4xl font-bold mb-4">Professional Web & Mobile App Scraping Services</h1>
    <p class="text-lg mb-6">Automated data extraction for e-commerce, travel, real estate, and more.</p>
    <a href="#contact" class="bg-blue-600 text-white py-3 px-6 rounded-xl hover:bg-blue-700">Get a Free Quote</a>
  </section>

  <!-- Contact Form -->
  <section id="contact" class="py-16 px-6 max-w-3xl mx-auto">
    <h2 class="text-3xl font-semibold mb-8 text-center">Get in Touch</h2>
    <form id="contactForm" class="bg-white p-6 rounded-xl shadow-md space-y-4">
      <input type="text" id="name" placeholder="Your Name" class="w-full border p-3 rounded" required />
      <input type="email" id="email" placeholder="Your Email" class="w-full border p-3 rounded" required />
      <textarea id="query" placeholder="Tell us about your scraping needs..." class="w-full border p-3 rounded" rows="5" required></textarea>
      <button type="submit" class="bg-blue-600 text-white py-3 px-6 rounded-xl hover:bg-blue-700">Submit Request</button>
    </form>
    <p id="status" class="mt-4 text-center text-green-600 hidden">Thank you! We’ll get back to you soon.</p>
  </section>

  <footer class="bg-gray-800 text-white py-6 text-center">
    <p>&copy; 2025 Web Scraping Experts. All rights reserved.</p>
  </footer>

  <!-- Supabase Integration -->
  <script>
    const SUPABASE_URL = "https://ldvuktgqvisftvctklbw.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkdnVrdGdxdmlzZnR2Y3RrbGJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM0MzUxMjEsImV4cCI6MjA2OTAxMTEyMX0.8goYVz4jbGXodNOr0iyRP6YvxiCwYulP-Nm0z3drDug";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById("contactForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const query = document.getElementById("query").value;

      const { error } = await supabase.from("User_data").insert([
        { User_Name: name, User_Email: email, User_Querry: query }
      ]);

      if (error) {
        alert("There was an error submitting your request. Please try again.");
        console.error(error);
        return;
      }

      // Call app.py to send email
      fetch("https://webscraping-k15j.onrender.com/send-email", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, query })
      })
      .then(res => res.json())
      .then(data => {
        if (data.message) {
          document.getElementById("contactForm").reset();
          document.getElementById("status").classList.remove("hidden");
          alert("Request submitted and email sent successfully!");
        } else {
          alert("Data saved, but email sending failed: " + (data.error || "Unknown error"));
        }
      })
      .catch(err => {
        console.error("Email error:", err);
        alert("Thanks for reaching to us. We will contact you ASAP");
      });
    });
  </script>

</body>
</html>
